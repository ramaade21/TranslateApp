name: Build & Release APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-build-debug:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "LINGUATRANSLATE_BASE_URL_DEBUG=${{ vars.BASE_URL_DEBUG || 'http://10.0.2.2:3000/' }}" >> local.properties
          echo "LINGUATRANSLATE_APP_API_KEY=${{ secrets.APP_API_KEY }}" >> local.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: linguatranslate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: Signed release APK + GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build-debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "LINGUATRANSLATE_BASE_URL_RELEASE=${{ secrets.BASE_URL_RELEASE }}" >> local.properties
          echo "LINGUATRANSLATE_APP_API_KEY=${{ secrets.APP_API_KEY }}" >> local.properties

      - name: Build signed release APK
        env:
          LINGUA_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          LINGUA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LINGUA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LINGUA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

      - name: Publish GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
